# Thêm các block này vào /etc/cloudflared/config.yml
# NGAY TRƯỚC dòng "service: http_status:404".
# Giữ nguyên hostname Asiagiving / tiemnhaduy / onthilaixe.
#
#   sudo cp deploy/cloudflared.config.yml /etc/cloudflared/config.yml
#   sudo cloudflared tunnel ingress validate
#   sudo systemctl restart cloudflared

  - hostname: signagehub.online
    service: http://127.0.0.1:9082

  - hostname: www.signagehub.online
    service: http://127.0.0.1:9082

  - hostname: app.signagehub.online
    service: http://127.0.0.1:9083

  - hostname: api.signagehub.online
    service: http://127.0.0.1:9080

  - hostname: ws.signagehub.online
    service: http://127.0.0.1:9081
    originRequest:
      connectTimeout: 30s
      keepAliveTimeout: 90s
      disableChunkedEncoding: true
